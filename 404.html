<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 · LUO Zhenyu</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f172a'/%3E%3Ctext x='32' y='42' font-family='Arial,Helvetica,sans-serif' font-size='28' font-weight='bold' fill='%2338bdf8' text-anchor='middle'%3EZL%3C/text%3E%3C/svg%3E">
  <style>
    :root { --bg:#0b1220; --text:#e5ecf8; --dim:#9db0d0; --accent:#38bdf8; }
    @media (prefers-color-scheme: light) {
      :root { --bg:#f7f9fc; --text:#17233a; --dim:#51617e; --accent:#0369a1; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "Avenir Next","Segoe UI","PingFang SC",system-ui,sans-serif;
      background: var(--bg); color: var(--text); text-align: center; padding: 1.5rem;
    }
    .code { font-size: clamp(4rem, 14vw, 7rem); font-weight: 800; line-height: 1; color: var(--accent); }
    h1 { margin: 0.6rem 0 0; font-size: 1.4rem; font-weight: 700; }
    p { color: var(--dim); margin: 0.7rem 0 1.8rem; }
    a {
      display: inline-block; padding: 0.65rem 1.4rem; border-radius: 8px;
      border: 1px solid var(--accent); color: var(--accent);
      font-weight: 700; text-decoration: none;
    }
    a:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>This URL is not part of the site.</p>
    <a href="/">Back to homepage</a>
  </main>
</body>
</html>
