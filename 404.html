<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 — Page not found · LUO Zhenyu</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Ctext x='32' y='42' font-family='Arial,Helvetica,sans-serif' font-size='30' font-weight='bold' fill='%2338bdf8' text-anchor='middle'%3EZL%3C/text%3E%3C/svg%3E">
  <style>
    :root { --bg:#0b1220; --text:#e5ecf8; --dim:#9db0d0; --accent:#38bdf8; }
    @media (prefers-color-scheme: light) {
      :root { --bg:#f5f8fd; --text:#17233a; --dim:#51617e; --accent:#0369a1; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "Avenir Next","Segoe UI","PingFang SC",system-ui,sans-serif;
      background: var(--bg); color: var(--text); text-align: center; padding: 1.5rem;
    }
    .code { font-size: clamp(5rem, 18vw, 9rem); font-weight: 800; line-height: 1;
      background: linear-gradient(120deg, var(--text) 40%, var(--accent));
      -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { color: var(--dim); margin: 0.8rem 0 2rem; }
    a { display: inline-block; padding: 0.7rem 1.6rem; border-radius: 999px;
      background: linear-gradient(135deg, #0ea5e9, #38bdf8); color: #04121f;
      font-weight: 700; text-decoration: none; }
    a:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1 style="margin:0.4rem 0 0;">Lost in the network…</h1>
    <p>The packet you requested timed out — this page does not exist.</p>
    <a href="/">← Back to the homepage</a>
  </main>
</body>
</html>
