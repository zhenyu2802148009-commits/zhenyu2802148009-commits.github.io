<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-label="Stylised portrait illustration of LUO Zhenyu">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#16233f"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="360" height="360" rx="48" fill="url(#bgGrad)"/>
  <circle cx="180" cy="160" r="130" fill="url(#glow)"/>

  <!-- decorative network constellation -->
  <g stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2">
    <line x1="46"  y1="70"  x2="98"  y2="108"/>
    <line x1="98"  y1="108" x2="72"  y2="170"/>
    <line x1="316" y1="64"  x2="268" y2="104"/>
    <line x1="268" y1="104" x2="300" y2="168"/>
    <line x1="70"  y1="252" x2="118" y2="288"/>
    <line x1="292" y1="248" x2="248" y2="290"/>
  </g>
  <g fill="#38bdf8" fill-opacity="0.7">
    <circle cx="46"  cy="70"  r="4"/>
    <circle cx="98"  cy="108" r="3"/>
    <circle cx="72"  cy="170" r="2.4"/>
    <circle cx="316" cy="64"  r="4"/>
    <circle cx="268" cy="104" r="3"/>
    <circle cx="300" cy="168" r="2.4"/>
    <circle cx="70"  cy="252" r="3"/>
    <circle cx="118" cy="288" r="2.4"/>
    <circle cx="292" cy="248" r="3"/>
    <circle cx="248" cy="290" r="2.4"/>
  </g>

  <!-- avatar medallion -->
  <circle cx="180" cy="176" r="96" fill="#0b1220" stroke="url(#ringGrad)" stroke-width="5"/>

  <!-- head -->
  <ellipse cx="180" cy="150" rx="46" ry="50" fill="#e8b28a"/>
  <!-- hair -->
  <path d="M134 142 C134 100 160 84 180 84 C200 84 226 100 226 142
           C226 124 212 112 180 112 C148 112 134 124 134 142 Z" fill="#20242c"/>
  <path d="M134 142 C136 118 154 106 180 106 C206 106 224 118 226 142
           C220 130 206 122 180 122 C154 122 140 130 134 142 Z" fill="#2b303a"/>
  <!-- glasses -->
  <g stroke="#20242c" stroke-width="5" fill="rgba(255,255,255,0.14)">
    <circle cx="162" cy="152" r="16"/>
    <circle cx="198" cy="152" r="16"/>
    <line x1="178" y1="152" x2="182" y2="152"/>
    <line x1="146" y1="148" x2="136" y2="144"/>
    <line x1="214" y1="148" x2="224" y2="144"/>
  </g>
  <!-- smile -->
  <path d="M164 186 Q180 198 196 186" stroke="#b3805c" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- shoulders -->
  <path d="M96 300 C110 244 146 226 180 226 C214 226 250 244 264 300 L264 320 L96 320 Z" fill="#0ea5e9"/>
  <path d="M96 300 C110 244 146 226 180 226 C214 226 250 244 264 300" fill="none" stroke="#7dd3fc" stroke-width="3"/>
  <!-- collar -->
  <path d="M166 232 L180 252 L194 232" fill="none" stroke="#e0f2fe" stroke-width="4" stroke-linejoin="round"/>

  <!-- badge -->
  <g transform="translate(238,246)">
    <circle r="26" fill="#0b1220" stroke="#38bdf8" stroke-width="3"/>
    <path d="M-9 1 L-2 8 L10 -7" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
